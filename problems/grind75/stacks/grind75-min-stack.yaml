schema_version: 1
id: "grind75-min-stack"
difficulty: medium
title: "Min Stack"
statement: "Process stack commands push x, pop, top, and getMin. Input: q followed by q commands; pop is always valid. Output one line for each top or getMin command."
tags:
  - "grind75"
  - "week-3"
  - "stack"
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: "sample"
    input: "7\npush -2\npush 0\npush -3\ngetMin\npop\ntop\ngetMin\n"
    expected_output: "-3\n0\n-2\n"
  - name: "single-item"
    input: "3\npush 5\ntop\ngetMin\n"
    expected_output: "5\n5\n"
  - name: "minimum-restored"
    input: "8\npush 3\npush 1\npush 2\ngetMin\npop\ngetMin\npop\ngetMin\n"
    expected_output: "1\n1\n3\n"
  - name: "negative-values"
    input: "5\npush -5\npush -8\ngetMin\npop\ntop\n"
    expected_output: "-8\n-5\n"
  - name: "duplicate-minimum"
    input: "8\npush 2\npush 2\ngetMin\npop\ngetMin\npop\npush 3\ntop\n"
    expected_output: "2\n2\n3\n"
  - name: "interleaved"
    input: "6\npush 4\npush 7\ntop\npop\ngetMin\ntop\n"
    expected_output: "7\n4\n4\n"
