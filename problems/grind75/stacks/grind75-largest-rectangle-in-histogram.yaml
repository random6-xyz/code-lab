schema_version: 1
id: grind75-largest-rectangle-in-histogram
difficulty: medium
title: Largest Rectangle in Histogram
statement: "Find the largest rectangular area under adjacent histogram bars. Input: n followed by n nonnegative heights. Output: the maximum area."
tags:
  - grind75
  - week-8
  - stack
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "6\n2 1 5 6 2 3\n"
    expected_output: "10\n"
  - name: flat
    input: "5\n2 2 2 2 2\n"
    expected_output: "10\n"
  - name: zero-barrier
    input: "4\n0 3 0 4\n"
    expected_output: "4\n"
  - name: edge-single-bar
    input: "1\n7\n"
    expected_output: "7\n"
  - name: edge-all-zero
    input: "3\n0 0 0\n"
    expected_output: "0\n"
  - name: edge-valley
    input: "5\n2 4 2 4 2\n"
    expected_output: "10\n"
