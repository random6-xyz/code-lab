schema_version: 1
id: "grind75-valid-parentheses"
difficulty: easy
title: "Valid Parentheses"
statement: "Given one line containing only bracket characters ()[]{} (possibly empty), determine whether every opening bracket is closed in the correct order. Input: one line. Output: true or false."
tags:
  - "grind75"
  - "week-1"
  - "stack"
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: "balanced"
    input: "()[]{}\n"
    expected_output: "true\n"
  - name: "nested"
    input: "{[()]}\n"
    expected_output: "true\n"
  - name: "wrong-type"
    input: "(]\n"
    expected_output: "false\n"
  - name: "wrong-order"
    input: "([)]\n"
    expected_output: "false\n"
  - name: "unclosed"
    input: "((()))(\n"
    expected_output: "false\n"
  - name: "empty"
    input: "\n"
    expected_output: "true\n"
