schema_version: 1
id: "grind75-01-matrix"
difficulty: medium
title: "01 Matrix"
statement: "For each cell in a binary matrix containing at least one zero, find its Manhattan distance to the nearest zero. Input: rows cols followed by the matrix. Output: the distance matrix."
tags:
  - "grind75"
  - "week-3"
  - "graph"
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: "sample"
    input: "3 3\n0 0 0\n0 1 0\n1 1 1\n"
    expected_output: "0 0 0\n0 1 0\n1 2 1\n"
  - name: "all-zero"
    input: "2 3\n0 0 0\n0 0 0\n"
    expected_output: "0 0 0\n0 0 0\n"
  - name: "single-zero"
    input: "1 4\n1 1 0 1\n"
    expected_output: "2 1 0 1\n"
  - name: "zero-at-corner"
    input: "2 2\n1 1\n1 0\n"
    expected_output: "2 1\n1 0\n"
  - name: "single-column"
    input: "4 1\n1\n1\n0\n1\n"
    expected_output: "2\n1\n0\n1\n"
  - name: "multiple-sources"
    input: "3 4\n1 1 1 0\n1 1 1 1\n0 1 1 1\n"
    expected_output: "2 2 1 0\n1 2 2 1\n0 1 2 2\n"
