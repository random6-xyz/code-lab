schema_version: 1
id: "grind75-minimum-height-trees"
difficulty: medium
title: "Minimum Height Trees"
statement: "Given a connected undirected tree with vertices 0 through n-1, find all roots that produce minimum height. Input: n followed by n-1 edges. Output the number of roots, then their sorted labels on one line."
tags:
  - "grind75"
  - "week-7"
  - "graph"
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: "path-of-four"
    input: "4\n1 0\n1 2\n1 3\n"
    expected_output: "1\n1\n"
  - name: "path-of-six"
    input: "6\n0 1\n1 2\n2 3\n3 4\n4 5\n"
    expected_output: "2\n2 3\n"
  - name: "single-node"
    input: "1\n"
    expected_output: "1\n0\n"
  - name: "star"
    input: "5\n1 0\n1 2\n1 3\n1 4\n"
    expected_output: "1\n1\n"
  - name: "two-nodes"
    input: "2\n0 1\n"
    expected_output: "2\n0 1\n"
  - name: "branched-tree"
    input: "6\n0 1\n1 2\n1 3\n3 4\n3 5\n"
    expected_output: "2\n1 3\n"
