schema_version: 1
id: "grind75-linked-list-cycle"
difficulty: easy
title: "Linked List Cycle"
statement: "Build a singly linked list and connect its tail to the node at index pos; pos = -1 means no cycle. Input: n, n node values, then pos (zero-based). Output: true if a cycle exists, otherwise false."
tags:
  - "grind75"
  - "week-1"
  - "linked-list"
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: "cycle-at-head"
    input: "4\n3 2 0 -4\n0\n"
    expected_output: "true\n"
  - name: "no-cycle"
    input: "4\n1 2 3 4\n-1\n"
    expected_output: "false\n"
  - name: "self-cycle"
    input: "1\n7\n0\n"
    expected_output: "true\n"
  - name: "single-no-cycle"
    input: "1\n7\n-1\n"
    expected_output: "false\n"
  - name: "cycle-at-middle"
    input: "5\n1 2 3 4 5\n2\n"
    expected_output: "true\n"
  - name: "empty-list"
    input: "0\n\n-1\n"
    expected_output: "false\n"
