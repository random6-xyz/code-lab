schema_version: 1
id: "grind75-reverse-linked-list"
difficulty: easy
title: "Reverse Linked List"
statement: "Reverse a singly linked list. Input: n followed by n integer values. Output: the reversed values on one line separated by spaces."
tags:
  - "grind75"
  - "week-2"
  - "linked-list"
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: "sample"
    input: "5\n1 2 3 4 5\n"
    expected_output: "5 4 3 2 1\n"
  - name: "empty"
    input: "0\n\n"
    expected_output: "\n"
  - name: "single"
    input: "1\n9\n"
    expected_output: "9\n"
  - name: "two-nodes"
    input: "2\n-1 4\n"
    expected_output: "4 -1\n"
  - name: "duplicates"
    input: "4\n3 3 1 3\n"
    expected_output: "3 1 3 3\n"
  - name: "negative-values"
    input: "3\n-8 0 -2\n"
    expected_output: "-2 0 -8\n"
