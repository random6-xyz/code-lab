schema_version: 1
id: "grind75-kth-smallest-element-in-a-bst"
difficulty: medium
title: "Kth Smallest Element in a BST"
statement: "Insert distinct integers into a binary search tree in the given order and return its kth smallest key (k is one-based). Input: n, n keys, then k. Output the key."
tags:
  - "grind75"
  - "week-7"
  - "binary-search-tree"
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: "sample"
    input: "7\n5 3 6 2 4 1 7\n3\n"
    expected_output: "3\n"
  - name: "minimum"
    input: "5\n8 3 10 1 6\n1\n"
    expected_output: "1\n"
  - name: "maximum"
    input: "5\n8 3 10 1 6\n5\n"
    expected_output: "10\n"
  - name: "single"
    input: "1\n-9\n1\n"
    expected_output: "-9\n"
  - name: "balanced-middle"
    input: "7\n4 2 6 1 3 5 7\n4\n"
    expected_output: "4\n"
  - name: "right-skewed"
    input: "4\n1 2 3 4\n2\n"
    expected_output: "2\n"
