schema_version: 1
id: grind75-validate-binary-search-tree
difficulty: medium
title: Validate Binary Search Tree
statement: "Check whether a binary tree satisfies strict BST ordering at every node. Input: n followed by level-order tokens, with null for missing nodes. Output: true or false."
tags:
  - grind75
  - week-4
  - binary-search-tree
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: valid
    input: "3\n2 1 3\n"
    expected_output: "true\n"
  - name: global-order
    input: "3\n5 1 7\n"
    expected_output: "true\n"
  - name: invalid-descendant
    input: "7\n5 4 8 null null 3 9\n"
    expected_output: "false\n"
  - name: edge-duplicate-key
    input: "3\n2 2 3\n"
    expected_output: "false\n"
  - name: edge-invalid-right-descendant
    input: "7\n10 5 15 null null 6 20\n"
    expected_output: "false\n"
  - name: edge-single-node
    input: "1\n0\n"
    expected_output: "true\n"
