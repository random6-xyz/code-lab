schema_version: 1
id: "grind75-maximum-depth-of-binary-tree"
difficulty: easy
title: "Maximum Depth of Binary Tree"
statement: "Given a binary tree in level-order form, find the number of nodes on its longest root-to-leaf path. Input: one line of values using null for absent nodes. Output: the maximum depth."
tags:
  - "grind75"
  - "week-2"
  - "binary-tree"
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: "sample"
    input: "3 9 20 null null 15 7\n"
    expected_output: "3\n"
  - name: "empty"
    input: "null\n"
    expected_output: "0\n"
  - name: "single"
    input: "1\n"
    expected_output: "1\n"
  - name: "left-chain"
    input: "1 2 null 3 null 4\n"
    expected_output: "4\n"
  - name: "perfect-tree"
    input: "1 2 3 4 5 6 7\n"
    expected_output: "3\n"
  - name: "sparse"
    input: "1 null 2 null 3\n"
    expected_output: "3\n"
