schema_version: 1
id: "grind75-diameter-of-binary-tree"
difficulty: easy
title: "Diameter of Binary Tree"
statement: "Given a binary tree in level-order form, compute its diameter: the number of edges on the longest path between any two nodes. Input: one line of values using null for absent nodes. Output: the diameter."
tags:
  - "grind75"
  - "week-2"
  - "binary-tree"
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: "sample"
    input: "1 2 3 4 5\n"
    expected_output: "3\n"
  - name: "single-node"
    input: "1\n"
    expected_output: "0\n"
  - name: "empty"
    input: "null\n"
    expected_output: "0\n"
  - name: "left-chain"
    input: "1 2 null 3 null 4\n"
    expected_output: "3\n"
  - name: "balanced-tree"
    input: "1 2 3 4 5 6 7\n"
    expected_output: "4\n"
  - name: "uneven-tree"
    input: "1 2 3 4 null null 5 6\n"
    expected_output: "5\n"
