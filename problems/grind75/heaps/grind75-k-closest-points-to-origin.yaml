schema_version: 1
id: "grind75-k-closest-points-to-origin"
difficulty: medium
title: "K Closest Points to Origin"
statement: "Return the k points closest to the origin by squared Euclidean distance. Input: n k followed by n x y pairs. Output the chosen points, one per line, ordered by distance and then x and y ascending."
tags:
  - "grind75"
  - "week-3"
  - "heap"
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: "sample"
    input: "4 2\n1 3\n-2 2\n2 -2\n0 1\n"
    expected_output: "0 1\n-2 2\n"
  - name: "all-points"
    input: "3 3\n3 3\n1 0\n-1 0\n"
    expected_output: "-1 0\n1 0\n3 3\n"
  - name: "one-point"
    input: "1 1\n-5 12\n"
    expected_output: "-5 12\n"
  - name: "tie-break"
    input: "4 2\n1 1\n-1 1\n1 -1\n-1 -1\n"
    expected_output: "-1 -1\n-1 1\n"
  - name: "origin-first"
    input: "3 1\n4 4\n0 0\n1 1\n"
    expected_output: "0 0\n"
  - name: "different-distances"
    input: "5 3\n2 2\n1 1\n-3 0\n0 2\n-1 -1\n"
    expected_output: "-1 -1\n1 1\n0 2\n"
