schema_version: 1
id: "grind75-find-median-from-data-stream"
difficulty: hard
title: "Find Median from Data Stream"
statement: "Process add x and median commands. The median is the middle value, or the average of the two middle values. Input: q followed by q commands; median is queried only after at least one value is added. Output each median, using an integer when integral and one decimal digit for halves."
tags:
  - "grind75"
  - "week-8"
  - "heap"
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: "sample"
    input: "6\nadd 1\nadd 2\nmedian\nadd 3\nmedian\nmedian\n"
    expected_output: "1.5\n2\n2\n"
  - name: "single"
    input: "2\nadd 8\nmedian\n"
    expected_output: "8\n"
  - name: "negative-pair"
    input: "4\nadd -1\nadd -2\nmedian\nmedian\n"
    expected_output: "-1.5\n-1.5\n"
  - name: "even-values"
    input: "5\nadd 4\nadd 0\nadd 10\nadd 2\nmedian\n"
    expected_output: "3\n"
  - name: "duplicates"
    input: "5\nadd 5\nadd 5\nadd 5\nmedian\nmedian\n"
    expected_output: "5\n5\n"
  - name: "mixed-order"
    input: "7\nadd 10\nadd -2\nadd 4\nmedian\nadd 8\nadd 0\nmedian\n"
    expected_output: "4\n4\n"
