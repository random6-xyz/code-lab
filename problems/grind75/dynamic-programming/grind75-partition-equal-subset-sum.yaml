schema_version: 1
id: grind75-partition-equal-subset-sum
difficulty: medium
title: Partition Equal Subset Sum
statement: "Determine whether an array can be split into two subsets with equal sums. Input: n followed by positive integers. Output: true or false."
tags:
  - grind75
  - week-6
  - dynamic-programming
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "4\n1 5 11 5\n"
    expected_output: "true\n"
  - name: odd-total
    input: "3\n1 2 4\n"
    expected_output: "false\n"
  - name: possible-with-duplicates
    input: "4\n2 2 3 3\n"
    expected_output: "true\n"
  - name: edge-no-equal-subset
    input: "3\n1 2 5\n"
    expected_output: "false\n"
  - name: edge-single-value
    input: "1\n4\n"
    expected_output: "false\n"
  - name: edge-multiple-combinations
    input: "4\n1 2 3 6\n"
    expected_output: "true\n"
