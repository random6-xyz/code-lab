schema_version: 1
id: "grind75-binary-search"
difficulty: easy
title: "Binary Search"
statement: "Search a nondecreasing integer array for target. Input: n target, then n integers. Output: the first zero-based index containing target, or -1 if absent."
tags:
  - "grind75"
  - "week-1"
  - "binary-search"
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: "sample"
    input: "6 9\n-1 0 3 5 9 12\n"
    expected_output: "4\n"
  - name: "missing-middle"
    input: "5 4\n1 2 3 5 6\n"
    expected_output: "-1\n"
  - name: "single-hit"
    input: "1 7\n7\n"
    expected_output: "0\n"
  - name: "single-miss"
    input: "1 8\n7\n"
    expected_output: "-1\n"
  - name: "duplicates-first-index"
    input: "6 2\n1 2 2 2 4 7\n"
    expected_output: "1\n"
  - name: "empty-array"
    input: "0 3\n\n"
    expected_output: "-1\n"
