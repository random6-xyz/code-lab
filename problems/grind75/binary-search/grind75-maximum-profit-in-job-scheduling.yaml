schema_version: 1
id: "grind75-maximum-profit-in-job-scheduling"
difficulty: hard
title: "Maximum Profit in Job Scheduling"
statement: "Choose non-overlapping jobs to maximize total profit. A job occupies [start, end), so a job may start when another ends. Input: n followed by n start end profit triples. Output the maximum profit."
tags:
  - "grind75"
  - "week-8"
  - "binary-search"
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: "sample"
    input: "4\n1 3 50\n2 4 10\n3 5 40\n3 6 70\n"
    expected_output: "120\n"
  - name: "all-compatible"
    input: "3\n1 2 5\n2 3 6\n3 4 7\n"
    expected_output: "18\n"
  - name: "overlapping"
    input: "3\n1 4 5\n2 5 6\n3 6 4\n"
    expected_output: "6\n"
  - name: "choose-one-long"
    input: "3\n1 10 20\n2 3 8\n3 4 9\n"
    expected_output: "20\n"
  - name: "zero-jobs"
    input: "0\n"
    expected_output: "0\n"
  - name: "unsorted-input"
    input: "4\n4 6 5\n1 3 4\n3 4 3\n6 8 6\n"
    expected_output: "18\n"
