schema_version: 1
id: grind75-insert-interval
difficulty: medium
title: Insert Interval
statement: "Insert a new closed interval into a list of non-overlapping intervals sorted by start, merging overlaps. Input: n, n intervals, then the new interval. Output: count and resulting intervals."
tags:
  - grind75
  - week-3
  - array
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "4\n1 2\n3 5\n6 7\n8 10\n4 8\n"
    expected_output: "2\n1 2\n3 10\n"
  - name: before-all
    input: "2\n3 5\n7 9\n0 2\n"
    expected_output: "3\n0 2\n3 5\n7 9\n"
  - name: merge-all
    input: "3\n1 2\n4 5\n7 8\n0 10\n"
    expected_output: "1\n0 10\n"
  - name: edge-empty-list
    input: "0\n4 7\n"
    expected_output: "1\n4 7\n"
  - name: edge-new-interval-inside
    input: "2\n1 10\n12 15\n3 4\n"
    expected_output: "2\n1 10\n12 15\n"
  - name: edge-touching-closed
    input: "2\n1 2\n5 7\n2 5\n"
    expected_output: "1\n1 7\n"
