schema_version: 1
id: "grind75-majority-element"
difficulty: easy
title: "Majority Element"
statement: "Given an integer array containing a value that occurs more than n/2 times, find that value. Input: n followed by n integers. Output: the majority value."
tags:
  - "grind75"
  - "week-2"
  - "array"
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: "sample"
    input: "7\n2 2 1 1 1 2 2\n"
    expected_output: "2\n"
  - name: "single"
    input: "1\n-4\n"
    expected_output: "-4\n"
  - name: "all-equal"
    input: "5\n9 9 9 9 9\n"
    expected_output: "9\n"
  - name: "majority-at-end"
    input: "5\n1 2 2 2 2\n"
    expected_output: "2\n"
  - name: "negative-majority"
    input: "6\n-1 -1 3 -1 4 -1\n"
    expected_output: "-1\n"
  - name: "alternating-minority"
    input: "7\n0 1 0 2 0 3 0\n"
    expected_output: "0\n"
