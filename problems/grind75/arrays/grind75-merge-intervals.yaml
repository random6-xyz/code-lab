schema_version: 1
id: grind75-merge-intervals
difficulty: medium
title: Merge Intervals
statement: "Merge every overlapping closed interval. Sort result by start, then end. Input: n followed by n start/end pairs. Output: interval count, then merged pairs."
tags:
  - grind75
  - week-5
  - array
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "4\n1 3\n2 6\n8 10\n15 18\n"
    expected_output: "3\n1 6\n8 10\n15 18\n"
  - name: touching
    input: "3\n1 2\n2 4\n7 8\n"
    expected_output: "2\n1 4\n7 8\n"
  - name: nested
    input: "3\n1 10\n2 3\n4 8\n"
    expected_output: "1\n1 10\n"
  - name: edge-empty
    input: "0\n"
    expected_output: "0\n"
  - name: edge-single-point
    input: "1\n-2 -2\n"
    expected_output: "1\n-2 -2\n"
  - name: edge-negative-overlap
    input: "3\n-5 -1\n-3 0\n2 4\n"
    expected_output: "2\n-5 0\n2 4\n"
