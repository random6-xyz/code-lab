schema_version: 1
id: "grind75-3sum"
difficulty: medium
title: "3Sum"
statement: "Find all unique triples of distinct array elements whose sum is zero. Input: n followed by n integers. Output: the number of triples, then each triple in ascending order; list triples lexicographically. If none exist, output 0."
tags:
  - "grind75"
  - "week-3"
  - "array"
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: "sample"
    input: "6\n-1 0 1 2 -1 -4\n"
    expected_output: "2\n-1 -1 2\n-1 0 1\n"
  - name: "no-solution"
    input: "3\n1 2 3\n"
    expected_output: "0\n"
  - name: "all-zeroes"
    input: "4\n0 0 0 0\n"
    expected_output: "1\n0 0 0\n"
  - name: "two-solutions"
    input: "6\n-2 0 1 1 2 -1\n"
    expected_output: "3\n-2 0 2\n-2 1 1\n-1 0 1\n"
  - name: "short-array"
    input: "2\n-1 1\n"
    expected_output: "0\n"
  - name: "duplicates"
    input: "6\n-4 -2 -2 2 2 4\n"
    expected_output: "2\n-4 2 2\n-2 -2 4\n"
