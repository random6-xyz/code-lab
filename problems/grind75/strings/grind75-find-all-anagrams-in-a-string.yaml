schema_version: 1
id: "grind75-find-all-anagrams-in-a-string"
difficulty: medium
title: "Find All Anagrams in a String"
statement: "Find every starting index where p is an anagram of a substring of s. Input: s and p on separate lowercase-letter lines; p is nonempty. Output the count, then the zero-based indices on one line (omit the second line when the count is zero)."
tags:
  - "grind75"
  - "week-7"
  - "string"
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: "sample"
    input: "cbaebabacd\nabc\n"
    expected_output: "2\n0 6\n"
  - name: "overlapping"
    input: "abab\nab\n"
    expected_output: "3\n0 1 2\n"
  - name: "no-match"
    input: "abcdef\nxyz\n"
    expected_output: "0\n"
  - name: "same-length"
    input: "abc\ncba\n"
    expected_output: "1\n0\n"
  - name: "repeated-letters"
    input: "baa\naa\n"
    expected_output: "1\n1\n"
  - name: "pattern-longer"
    input: "ab\nabc\n"
    expected_output: "0\n"
