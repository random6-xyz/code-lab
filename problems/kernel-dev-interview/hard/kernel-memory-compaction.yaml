schema_version: 1
id: kernel-memory-compaction
difficulty: hard
title: Compact Movable Memory Blocks
statement: |
  Memory is a contiguous sequence of N segments starting at address zero. Each
  segment is either A id size for an allocated movable block or F size for a
  free block; all sizes are positive. Compact memory by moving allocated blocks
  toward address zero while preserving their input order. Free space becomes one
  interval at the end. Count the bytes moved as the sum of the sizes of allocated
  blocks whose start address changed (not their travel distance). Print that
  count, then one line per allocated block in input order as id new_start, then
  FREE free_start free_size. If no space is free, print FREE total_size 0.
tags:
  - kernel
  - memory-management
  - compaction
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: move-blocks-and-coalesce-holes
    input: |
      6
      A A 10
      F 5
      A B 7
      F 3
      A C 4
      F 2
    expected_output: |
      11
      A 0
      B 10
      C 17
      FREE 21 10
  - name: no-free-space
    input: |
      2
      A first 4
      A second 3
    expected_output: |
      0
      first 0
      second 4
      FREE 7 0
  - name: all-segments-are-free
    input: |
      3
      F 2
      F 3
      F 1
    expected_output: |
      0
      FREE 0 6
  - name: already-compact-layout
    input: |
      3
      A x 2
      A y 5
      F 4
    expected_output: |
      0
      x 0
      y 2
      FREE 7 4
