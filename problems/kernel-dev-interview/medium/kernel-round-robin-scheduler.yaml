schema_version: 1
id: kernel-round-robin-scheduler
difficulty: medium
title: Simulate Round-Robin CPU Scheduling
statement: |
  Read N processes and a positive time quantum T. Each process has a unique id,
  arrival time, and positive CPU burst. Simulate a single-core round-robin
  scheduler. Enqueue arriving processes in input order; when a time slice ends,
  enqueue all processes that arrived by that time before re-enqueuing the running
  process if it still has work. If the ready queue is empty, jump to the next
  arrival. Print each process id and completion time in original input order.
tags:
  - kernel
  - scheduling
  - simulation
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: arrivals-and-preemption
    input: |
      3 2
      A 0 5
      B 1 3
      C 2 1
    expected_output: |
      A 9
      B 8
      C 5
  - name: idle-before-first-arrival
    input: |
      2 3
      first 4 2
      second 10 1
    expected_output: |
      first 6
      second 11
  - name: quantum-exceeds-all-bursts
    input: |
      3 10
      A 0 2
      B 0 1
      C 0 3
    expected_output: |
      A 2
      B 3
      C 6
  - name: single-process-multiple-slices
    input: |
      1 1
      solo 0 3
    expected_output: |
      solo 3
