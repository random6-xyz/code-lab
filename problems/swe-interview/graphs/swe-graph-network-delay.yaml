schema_version: 1
id: swe-graph-network-delay
difficulty: medium
title: Network Delay Time
statement: "Find the time for a signal from source to reach every node in a directed weighted graph, or -1 if some node is unreachable. Input: n, m, source (1-based), then m edges u v weight. Output: the delay."
tags:
  - swe-interview
  - graphs
  - dijkstra
  - shortest-path
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "4 4 2\n2 1 1\n2 3 1\n3 4 1\n1 4 5\n"
    expected_output: "2\n"
  - name: unreachable
    input: "3 1 1\n1 2 4\n"
    expected_output: "-1\n"
  - name: single-node
    input: "1 0 1\n"
    expected_output: "0\n"
  - name: edge-shorter-alternate-route
    input: "4 5 1\n1 2 10\n1 3 2\n3 2 1\n2 4 1\n3 4 20\n"
    expected_output: "4\n"
  - name: edge-direct-source
    input: "2 1 1\n1 2 7\n"
    expected_output: "7\n"
  - name: edge-zero-delay
    input: "3 2 2\n2 1 0\n1 3 0\n"
    expected_output: "0\n"
