schema_version: 1
id: swe-graph-course-order
difficulty: medium
title: Course Schedule Order
statement: "Return a valid topological ordering of courses; if several exist, return the lexicographically smallest. Input: n and m followed by prerequisite pairs course prerequisite; each pair means the prerequisite must be completed first. Output: -1 if impossible, otherwise n course IDs."
tags:
  - swe-interview
  - graphs
  - topological-sort
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "4 4\n1 0\n2 0\n3 1\n3 2\n"
    expected_output: "0 1 2 3\n"
  - name: cycle
    input: "2 2\n1 0\n0 1\n"
    expected_output: "-1\n"
  - name: independent
    input: "3 0\n"
    expected_output: "0 1 2\n"
  - name: edge-single-course
    input: "1 0\n"
    expected_output: "0\n"
  - name: edge-chain
    input: "4 3\n1 0\n2 1\n3 2\n"
    expected_output: "0 1 2 3\n"
  - name: edge-ambiguous-order
    input: "4 2\n2 0\n3 1\n"
    expected_output: "0 1 2 3\n"
