schema_version: 1
id: swe-graph-cheapest-flights
difficulty: medium
title: Cheapest Flight Within K Stops
statement: "Find the cheapest price from src to dst using at most k intermediate stops in a directed graph. Input: n, m, src, dst, k, then m flights u v price. Output: minimum cost, or -1."
tags:
  - swe-interview
  - graphs
  - shortest-path
  - dynamic-programming
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "4 5 0 3 1\n0 1 100\n1 2 100\n2 3 100\n0 2 500\n0 3 700\n"
    expected_output: "600\n"
  - name: two-stops-allowed
    input: "4 4 0 3 2\n0 1 100\n1 2 100\n2 3 100\n0 3 1000\n"
    expected_output: "300\n"
  - name: unreachable
    input: "3 1 0 2 1\n0 1 20\n"
    expected_output: "-1\n"
  - name: edge-zero-stops
    input: "3 3 0 2 0\n0 1 5\n1 2 5\n0 2 20\n"
    expected_output: "20\n"
  - name: edge-direct-cheapest
    input: "3 3 0 2 2\n0 1 50\n1 2 50\n0 2 70\n"
    expected_output: "70\n"
  - name: edge-src-equals-dst
    input: "2 1 0 0 0\n0 1 4\n"
    expected_output: "0\n"
