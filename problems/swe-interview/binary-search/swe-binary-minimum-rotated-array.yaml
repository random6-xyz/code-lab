schema_version: 1
id: swe-binary-minimum-rotated-array
difficulty: medium
title: Minimum in Rotated Sorted Array
statement: "Find the smallest value in a strictly increasing array rotated at an unknown pivot. Input: n followed by the array. Output: the minimum."
tags:
  - swe-interview
  - binary-search
  - search
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "5\n3 4 5 1 2\n"
    expected_output: "1\n"
  - name: unrotated
    input: "4\n1 2 3 4\n"
    expected_output: "1\n"
  - name: pivot-end
    input: "3\n2 3 1\n"
    expected_output: "1\n"
  - name: edge-single
    input: "1\n9\n"
    expected_output: "9\n"
  - name: edge-two-elements
    input: "2\n2 1\n"
    expected_output: "1\n"
  - name: edge-pivot-first
    input: "5\n10 12 15 18 20\n"
    expected_output: "10\n"
