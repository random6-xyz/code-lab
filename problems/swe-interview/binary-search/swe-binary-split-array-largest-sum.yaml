schema_version: 1
id: swe-binary-split-array-largest-sum
difficulty: medium
title: Split Array Largest Sum
statement: "Split a nonnegative array into exactly k nonempty contiguous parts, minimizing the largest part sum. Input: n and k followed by the array. Output: the minimum possible largest sum."
tags:
  - swe-interview
  - binary-search
  - answer-space-search
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "5 2\n7 2 5 10 8\n"
    expected_output: "18\n"
  - name: single-part
    input: "4 1\n1 2 3 4\n"
    expected_output: "10\n"
  - name: one-per-part
    input: "3 3\n2 4 3\n"
    expected_output: "4\n"
  - name: edge-one-part
    input: "5 1\n2 2 2 2 2\n"
    expected_output: "10\n"
  - name: edge-each-value-is-a-part
    input: "4 4\n1 2 3 4\n"
    expected_output: "4\n"
  - name: edge-zero-values
    input: "3 2\n0 0 0\n"
    expected_output: "0\n"
