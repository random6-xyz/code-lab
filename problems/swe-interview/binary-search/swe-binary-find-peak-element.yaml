schema_version: 1
id: swe-binary-find-peak-element
difficulty: medium
title: Find a Peak Element
statement: "Find the smallest index whose value is greater than its existing neighbors. Adjacent values are distinct. Input: n followed by the array. Output: that index."
tags:
  - swe-interview
  - binary-search
  - search
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "4\n1 2 3 1\n"
    expected_output: "2\n"
  - name: left-peak
    input: "3\n3 2 1\n"
    expected_output: "0\n"
  - name: right-peak
    input: "5\n1 2 3 4 5\n"
    expected_output: "4\n"
  - name: edge-two-rising
    input: "2\n1 2\n"
    expected_output: "1\n"
  - name: edge-two-falling
    input: "2\n2 1\n"
    expected_output: "0\n"
  - name: edge-single
    input: "1\n9\n"
    expected_output: "0\n"
