schema_version: 1
id: swe-binary-kth-missing-positive
difficulty: medium
title: Kth Missing Positive Number
statement: "Given a strictly increasing positive array, find its kth missing positive integer. Input: n and k followed by the array. Output: the missing value."
tags:
  - swe-interview
  - binary-search
  - search
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "5 5\n2 3 4 7 11\n"
    expected_output: "9\n"
  - name: before-first
    input: "3 1\n5 6 7\n"
    expected_output: "1\n"
  - name: after-last
    input: "2 5\n1 2\n"
    expected_output: "7\n"
  - name: edge-first-missing
    input: "3 1\n2 3 4\n"
    expected_output: "1\n"
  - name: edge-no-missing-before-end
    input: "4 2\n1 2 3 4\n"
    expected_output: "6\n"
  - name: edge-large-gap
    input: "3 6\n2 100 101\n"
    expected_output: "7\n"
