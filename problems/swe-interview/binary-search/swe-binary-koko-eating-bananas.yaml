schema_version: 1
id: swe-binary-koko-eating-bananas
difficulty: medium
title: Koko Eating Bananas
statement: "Find the smallest integer eating speed that lets all piles be finished within h hours, with at most one pile eaten per hour. Input: n and h followed by pile sizes. Output: the minimum speed."
tags:
  - swe-interview
  - binary-search
  - answer-space-search
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "4 8\n3 6 7 11\n"
    expected_output: "4\n"
  - name: tight-hours
    input: "4 4\n3 6 7 11\n"
    expected_output: "11\n"
  - name: large-hours
    input: "3 20\n30 11 23\n"
    expected_output: "4\n"
  - name: edge-one-pile
    input: "1 4\n9\n"
    expected_output: "3\n"
  - name: edge-one-hour-per-pile
    input: "3 3\n2 8 4\n"
    expected_output: "8\n"
  - name: edge-exact-speed
    input: "3 6\n6 6 6\n"
    expected_output: "3\n"
