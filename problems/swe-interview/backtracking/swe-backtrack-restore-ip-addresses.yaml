schema_version: 1
id: swe-backtrack-restore-ip-addresses
difficulty: medium
title: Restore IP Addresses
statement: "Insert three dots into a digit string to form all valid IPv4 addresses. Segments must be 0..255 and cannot have leading zeroes unless equal to 0. Sort addresses lexicographically. Input: a digit string. Output: count and addresses."
tags:
  - swe-interview
  - backtracking
  - recursion
  - strings
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "25525511135\n"
    expected_output: "2\n255.255.11.135\n255.255.111.35\n"
  - name: leading-zeroes
    input: "0000\n"
    expected_output: "1\n0.0.0.0\n"
  - name: invalid-length
    input: "123\n"
    expected_output: "0\n"
  - name: edge-leading-zeroes
    input: "010010\n"
    expected_output: "2\n0.10.0.10\n0.100.1.0\n"
  - name: edge-smallest-valid
    input: "101023\n"
    expected_output: "5\n1.0.10.23\n1.0.102.3\n10.1.0.23\n10.10.2.3\n101.0.2.3\n"
  - name: edge-too-short
    input: "1234567890123\n"
    expected_output: "0\n"
