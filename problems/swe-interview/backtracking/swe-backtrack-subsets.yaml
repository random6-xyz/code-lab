schema_version: 1
id: swe-backtrack-subsets
difficulty: medium
title: Subsets
statement: "Generate every subset of n distinct integers. Sort values inside subsets and order subsets lexicographically; represent the empty subset as -. Input: n followed by n integers. Output: subset count, then one subset per line."
tags:
  - swe-interview
  - backtracking
  - recursion
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "3\n1 2 3\n"
    expected_output: "8\n-\n1\n1 2\n1 2 3\n1 3\n2\n2 3\n3\n"
  - name: negative
    input: "2\n-1 0\n"
    expected_output: "4\n-\n-1\n-1 0\n0\n"
  - name: empty
    input: "0\n\n"
    expected_output: "1\n-\n"
  - name: edge-one-negative
    input: "1\n-5\n"
    expected_output: "2\n-\n-5\n"
  - name: edge-two-values
    input: "2\n2 5\n"
    expected_output: "4\n-\n2\n2 5\n5\n"
  - name: edge-empty-input
    input: "3\n-2 0 2\n"
    expected_output: "8\n-\n-2\n-2 0\n-2 0 2\n-2 2\n0\n0 2\n2\n"
