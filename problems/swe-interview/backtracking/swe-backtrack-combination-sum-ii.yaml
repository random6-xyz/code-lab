schema_version: 1
id: swe-backtrack-combination-sum-ii
difficulty: medium
title: Combination Sum II
statement: "Choose each candidate at most once to reach target; duplicate input values must not create duplicate combinations. Sort and lexicographically order results. Input: n and target followed by candidates. Output: count and combinations."
tags:
  - swe-interview
  - backtracking
  - recursion
  - deduplication
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "7 8\n10 1 2 7 6 1 5\n"
    expected_output: "4\n1 1 6\n1 2 5\n1 7\n2 6\n"
  - name: duplicates
    input: "5 5\n1 1 1 2 2\n"
    expected_output: "2\n1 1 1 2\n1 2 2\n"
  - name: none
    input: "3 9\n1 2 3\n"
    expected_output: "0\n"
  - name: edge-single-use
    input: "3 4\n1 2 4\n"
    expected_output: "1\n4\n"
  - name: edge-duplicate-pairs
    input: "4 4\n1 1 2 2\n"
    expected_output: "2\n1 1 2\n2 2\n"
  - name: edge-no-candidate
    input: "2 20\n1 3\n"
    expected_output: "0\n"
