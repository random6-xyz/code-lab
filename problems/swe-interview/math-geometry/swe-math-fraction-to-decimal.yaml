schema_version: 1
id: swe-math-fraction-to-decimal
difficulty: medium
title: Fraction to Recurring Decimal
statement: "Convert numerator/denominator to a decimal string. Enclose the repeating portion in parentheses; preserve a leading minus sign. Input: numerator and nonzero denominator. Output: the exact decimal representation."
tags:
  - swe-interview
  - math-geometry
  - number-conversion
  - hash-map
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: recurring
    input: "1 3\n"
    expected_output: "0.(3)\n"
  - name: terminating
    input: "-50 8\n"
    expected_output: "-6.25\n"
  - name: integer
    input: "7 -2\n"
    expected_output: "-3.5\n"
  - name: edge-sixth
    input: "1 6\n"
    expected_output: "0.1(6)\n"
  - name: edge-negative-half
    input: "-1 2\n"
    expected_output: "-0.5\n"
  - name: edge-zero-numerator
    input: "0 -7\n"
    expected_output: "0\n"
