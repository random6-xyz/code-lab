schema_version: 1
id: swe-math-number-of-boomerangs
difficulty: medium
title: Number of Boomerangs
statement: "Count ordered triples of distinct points (i,j,k) where the squared distance from i to j equals the squared distance from i to k. Points are distinct. Input: n followed by x/y pairs. Output: the count."
tags:
  - swe-interview
  - math-geometry
  - geometry
  - hash-map
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "3\n0 0\n1 0\n-1 0\n"
    expected_output: "2\n"
  - name: square
    input: "4\n0 0\n0 1\n1 0\n1 1\n"
    expected_output: "8\n"
  - name: no-equal-distances
    input: "3\n0 0\n1 0\n0 2\n"
    expected_output: "0\n"
  - name: edge-three-equal-distances
    input: "4\n0 0\n1 0\n-1 0\n0 1\n"
    expected_output: "8\n"
  - name: edge-only-two-points
    input: "2\n0 0\n1 0\n"
    expected_output: "0\n"
  - name: edge-square-again
    input: "5\n0 0\n1 0\n-1 0\n0 1\n0 -1\n"
    expected_output: "20\n"
