schema_version: 1
id: swe-window-find-anagrams
difficulty: medium
title: Find All Anagrams
statement: "Return all starting indices where a substring of s is an anagram of p. Input: s and p. Output: count followed by the indices in ascending order."
tags:
  - swe-interview
  - sliding-window
  - strings
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "cbaebabacd abc\n"
    expected_output: "2\n0 6\n"
  - name: overlap
    input: "abab ab\n"
    expected_output: "3\n0 1 2\n"
  - name: none
    input: "abcd xy\n"
    expected_output: "0\n\n"
  - name: pattern-longer
    input: "ab abc\n"
    expected_output: "0\n\n"
  - name: all-overlap
    input: "aaaa aa\n"
    expected_output: "3\n0 1 2\n"
  - name: exact-match
    input: "silent listen\n"
    expected_output: "1\n0\n"
