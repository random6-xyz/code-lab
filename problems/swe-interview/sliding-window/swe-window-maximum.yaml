schema_version: 1
id: swe-window-maximum
difficulty: medium
title: Sliding Window Maximum
statement: "For each contiguous window of size k, output its maximum. Input: n and k followed by n integers. Output: the maxima in order."
tags:
  - swe-interview
  - sliding-window
  - deque
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "8 3\n1 3 -1 -3 5 3 6 7\n"
    expected_output: "3 3 5 5 6 7\n"
  - name: window-one
    input: "4 1\n2 1 4 3\n"
    expected_output: "2 1 4 3\n"
  - name: full-window
    input: "4 4\n1 5 2 3\n"
    expected_output: "5\n"
  - name: negative-values
    input: "5 2\n-5 -2 -8 -1 -3\n"
    expected_output: "-2 -2 -1 -1\n"
  - name: duplicate-maxima
    input: "5 3\n4 4 1 4 4\n"
    expected_output: "4 4 4\n"
  - name: two-elements
    input: "2 2\n-1 -7\n"
    expected_output: "-1\n"
