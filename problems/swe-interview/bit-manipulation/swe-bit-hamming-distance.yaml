schema_version: 1
id: swe-bit-hamming-distance
difficulty: medium
title: Hamming Distance
statement: "Count bit positions that differ between two nonnegative 32-bit integers. Input: x and y. Output: the Hamming distance."
tags:
  - swe-interview
  - bit-manipulation
  - bitwise
  - popcount
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "1 4\n"
    expected_output: "2\n"
  - name: same
    input: "7 7\n"
    expected_output: "0\n"
  - name: opposites
    input: "0 4294967295\n"
    expected_output: "32\n"
  - name: edge-alternating-bits
    input: "10 5\n"
    expected_output: "4\n"
  - name: edge-adjacent-values
    input: "8 9\n"
    expected_output: "1\n"
  - name: edge-high-bit
    input: "0 2147483648\n"
    expected_output: "1\n"
