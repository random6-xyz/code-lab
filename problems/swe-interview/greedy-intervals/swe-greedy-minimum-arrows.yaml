schema_version: 1
id: swe-greedy-minimum-arrows
difficulty: medium
title: Minimum Arrows to Burst Balloons
statement: "An arrow at x bursts every closed interval containing x. Find the minimum arrows needed to cover all intervals. Input: n followed by interval start/end pairs. Output: arrow count."
tags:
  - swe-interview
  - greedy-intervals
  - sorting
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "4\n10 16\n2 8\n1 6\n7 12\n"
    expected_output: "2\n"
  - name: nested
    input: "3\n1 10\n2 3\n4 8\n"
    expected_output: "2\n"
  - name: single
    input: "1\n-2 5\n"
    expected_output: "1\n"
  - name: edge-empty
    input: "0\n"
    expected_output: "0\n"
  - name: edge-same-endpoint
    input: "4\n1 2\n2 3\n2 4\n0 2\n"
    expected_output: "1\n"
  - name: edge-disjoint
    input: "3\n-5 -3\n0 1\n4 6\n"
    expected_output: "3\n"
