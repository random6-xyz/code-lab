schema_version: 1
id: swe-greedy-jump-game-ii
difficulty: medium
title: Jump Game II
statement: "Each array value is the maximum forward jump length from that position. Find the fewest jumps to reach the last index; reachability is guaranteed. Input: n followed by n nonnegative values. Output: the minimum jumps."
tags:
  - swe-interview
  - greedy-intervals
  - greedy
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "5\n2 3 1 1 4\n"
    expected_output: "2\n"
  - name: direct
    input: "5\n4 1 1 1 1\n"
    expected_output: "1\n"
  - name: single
    input: "1\n0\n"
    expected_output: "0\n"
  - name: edge-direct-jump
    input: "4\n3 0 0 0\n"
    expected_output: "1\n"
  - name: edge-one-step-each
    input: "4\n1 1 1 0\n"
    expected_output: "3\n"
  - name: edge-two-steps
    input: "5\n2 2 1 1 0\n"
    expected_output: "3\n"
