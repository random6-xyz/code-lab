schema_version: 1
id: swe-greedy-minimum-refueling-stops
difficulty: medium
title: Minimum Refueling Stops
statement: "A car starts with fuel units and must reach target; each station adds its fuel when reached. Find the fewest stops, or -1. Input: target, start fuel, n, then n position/fuel pairs sorted by position. Output: stop count."
tags:
  - swe-interview
  - greedy-intervals
  - heap
  - greedy
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "100 10 4\n10 60\n20 30\n30 30\n60 40\n"
    expected_output: "2\n"
  - name: no-stop
    input: "50 60 1\n25 10\n"
    expected_output: "0\n"
  - name: impossible
    input: "100 1 2\n10 10\n20 10\n"
    expected_output: "-1\n"
  - name: edge-start-fuel-reaches-target
    input: "50 50 2\n10 10\n30 10\n"
    expected_output: "0\n"
  - name: edge-first-station-unreachable
    input: "100 5 1\n10 100\n"
    expected_output: "-1\n"
  - name: edge-one-stop
    input: "100 50 1\n50 50\n"
    expected_output: "1\n"
