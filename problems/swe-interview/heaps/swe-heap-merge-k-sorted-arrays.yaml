schema_version: 1
id: swe-heap-merge-k-sorted-arrays
difficulty: medium
title: Merge K Sorted Arrays
statement: "Merge k ascending integer arrays into one ascending sequence. Input: k, then for each array its length and values. Output: all merged values."
tags:
  - swe-interview
  - heaps
  - k-way-merge
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "3\n3 1 4 5\n3 1 3 4\n2 2 6\n"
    expected_output: "1 1 2 3 4 4 5 6\n"
  - name: empty-arrays
    input: "3\n0\n2 -1 2\n0\n"
    expected_output: "-1 2\n"
  - name: one-array
    input: "1\n3 2 2 9\n"
    expected_output: "2 2 9\n"
  - name: edge-all-empty
    input: "3\n0\n0\n0\n"
    expected_output: "\n"
  - name: edge-singleton-arrays
    input: "3\n1 3\n1 1\n1 2\n"
    expected_output: "1 2 3\n"
  - name: edge-negative-values
    input: "2\n2 -5 -1\n3 -4 0 2\n"
    expected_output: "-5 -4 -1 0 2\n"
