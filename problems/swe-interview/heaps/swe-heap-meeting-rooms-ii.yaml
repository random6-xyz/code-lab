schema_version: 1
id: swe-heap-meeting-rooms-ii
difficulty: medium
title: Meeting Rooms II
statement: "Find the minimum number of rooms needed for half-open meeting intervals [start, end), so one meeting ending when another starts can use the same room. Input: n followed by n start/end pairs. Output: the room count."
tags:
  - swe-interview
  - heaps
  - intervals
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "3\n0 30\n5 10\n15 20\n"
    expected_output: "2\n"
  - name: touching
    input: "3\n1 3\n3 5\n5 8\n"
    expected_output: "1\n"
  - name: overlap-all
    input: "3\n1 5\n2 6\n3 7\n"
    expected_output: "3\n"
  - name: edge-same-start
    input: "3\n1 4\n1 3\n1 2\n"
    expected_output: "3\n"
  - name: edge-empty-list
    input: "0\n"
    expected_output: "0\n"
  - name: edge-one-meeting
    input: "1\n8 9\n"
    expected_output: "1\n"
