schema_version: 1
id: swe-heap-ipo
difficulty: medium
title: Maximize Capital
statement: "Choose at most k projects. Each project has a required capital and profit; after completing one, add its profit. Input: k, initial capital, n, then n profits and n requirements. Output: maximum final capital."
tags:
  - swe-interview
  - heaps
  - greedy
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "2 0 3\n1 2 3\n0 1 1\n"
    expected_output: "4\n"
  - name: cannot-start
    input: "2 1 2\n5 6\n10 20\n"
    expected_output: "1\n"
  - name: one-project
    input: "1 2 2\n3 4\n1 3\n"
    expected_output: "5\n"
  - name: edge-zero-projects-allowed
    input: "0 5 2\n10 20\n0 0\n"
    expected_output: "5\n"
  - name: edge-no-projects
    input: "3 7 0\n\n\n"
    expected_output: "7\n"
  - name: edge-two-projects
    input: "2 1 2\n2 3\n1 2\n"
    expected_output: "6\n"
