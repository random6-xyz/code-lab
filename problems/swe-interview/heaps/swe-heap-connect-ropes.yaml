schema_version: 1
id: swe-heap-connect-ropes
difficulty: medium
title: Minimum Cost to Connect Ropes
statement: "Repeatedly connect two ropes, paying their combined length; minimize the total cost of connecting all ropes. Input: n followed by rope lengths. Output: minimum total cost."
tags:
  - swe-interview
  - heaps
  - greedy
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "4\n4 3 2 6\n"
    expected_output: "29\n"
  - name: single
    input: "1\n8\n"
    expected_output: "0\n"
  - name: equal
    input: "3\n1 1 1\n"
    expected_output: "5\n"
  - name: edge-two-ropes
    input: "2\n4 5\n"
    expected_output: "9\n"
  - name: edge-zero-length
    input: "3\n0 0 5\n"
    expected_output: "5\n"
  - name: edge-empty
    input: "0\n\n"
    expected_output: "0\n"
