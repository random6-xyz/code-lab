schema_version: 1
id: swe-heap-running-median
difficulty: medium
title: Running Median Queries
statement: "Process add x and median operations. Print the current median for each median query; print an integer when integral and a .5 suffix otherwise. Input: q followed by q commands. Output: one median per query."
tags:
  - swe-interview
  - heaps
  - two-heaps
  - design
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "5\nadd 1\nadd 2\nmedian\nadd 3\nmedian\n"
    expected_output: "1.5\n2\n"
  - name: even-count
    input: "3\nadd -2\nadd -1\nmedian\n"
    expected_output: "-1.5\n"
  - name: odd-count
    input: "4\nadd 10\nadd 0\nadd 4\nmedian\n"
    expected_output: "4\n"
  - name: edge-negative-odd-count
    input: "4\nadd -5\nadd -1\nadd -9\nmedian\n"
    expected_output: "-5\n"
  - name: edge-even-count-after-more-adds
    input: "6\nadd 1\nadd 2\nadd 3\nadd 4\nmedian\nmedian\n"
    expected_output: "2.5\n2.5\n"
  - name: edge-duplicate-values
    input: "4\nadd 7\nadd 7\nmedian\nadd 7\n"
    expected_output: "7\n"
