schema_version: 1
id: swe-array-longest-consecutive-sequence
difficulty: medium
title: Longest Consecutive Sequence
statement: "Find the length of the longest run of consecutive integer values in an unsorted array. Input: n followed by n integers. Output: the maximum length, or 0 for an empty array."
tags:
  - swe-interview
  - arrays-hashing
  - hash-set
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "6\n100 4 200 1 3 2\n"
    expected_output: "4\n"
  - name: duplicates
    input: "7\n1 2 2 3 4 4 5\n"
    expected_output: "5\n"
  - name: empty
    input: "0\n\n"
    expected_output: "0\n"
  - name: negative-run
    input: "5\n-3 -2 -1 2 10\n"
    expected_output: "3\n"
  - name: all-isolated
    input: "4\n1 10 20 30\n"
    expected_output: "1\n"
  - name: one-value
    input: "1\n-8\n"
    expected_output: "1\n"
