schema_version: 1
id: swe-array-subarray-sum-k
difficulty: medium
title: Subarray Sum Equals K
statement: "Count contiguous subarrays whose sum equals k. Input: n and k, followed by n integers. Output: the count."
tags:
  - swe-interview
  - arrays-hashing
  - prefix-sum
  - hash-map
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "3 2\n1 1 1\n"
    expected_output: "2\n"
  - name: negative-values
    input: "5 3\n1 2 1 2 1\n"
    expected_output: "4\n"
  - name: zeroes
    input: "3 0\n0 0 0\n"
    expected_output: "6\n"
  - name: negative-prefix
    input: "4 0\n3 -1 -2 4\n"
    expected_output: "1\n"
  - name: repeated-prefixes
    input: "4 0\n1 -1 1 -1\n"
    expected_output: "4\n"
  - name: single-element
    input: "1 5\n5\n"
    expected_output: "1\n"
