schema_version: 1
id: swe-array-top-k-frequent
difficulty: medium
title: Top K Frequent Elements
statement: "Return the k most frequent values. Order by frequency descending, then value ascending. Input: n and k followed by n integers. Output: the k values in that order."
tags:
  - swe-interview
  - arrays-hashing
  - hash-map
  - heap
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "6 2\n1 1 1 2 2 3\n"
    expected_output: "1 2\n"
  - name: frequency-tie
    input: "6 2\n4 4 3 3 2 2\n"
    expected_output: "2 3\n"
  - name: negative
    input: "5 1\n-1 -1 2 2 2\n"
    expected_output: "2\n"
  - name: k-equals-distinct
    input: "4 2\n9 9 -1 -1\n"
    expected_output: "-1 9\n"
  - name: all-tied
    input: "4 4\n8 2 5 1\n"
    expected_output: "1 2 5 8\n"
  - name: one-value
    input: "5 1\n4 4 4 4 4\n"
    expected_output: "4\n"
