schema_version: 1
id: swe-array-set-matrix-zeroes
difficulty: medium
title: Set Matrix Zeroes
statement: "If a matrix cell is zero, set every cell in its row and column to zero in place. Input: m and n followed by an m-by-n matrix. Output: the resulting matrix, one row per line."
tags:
  - swe-interview
  - arrays-hashing
  - matrix
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "3 3\n1 1 1\n1 0 1\n1 1 1\n"
    expected_output: "1 0 1\n0 0 0\n1 0 1\n"
  - name: first-column
    input: "2 3\n0 1 2\n3 4 5\n"
    expected_output: "0 0 0\n0 4 5\n"
  - name: multiple-zeroes
    input: "3 4\n1 0 3 4\n5 6 0 8\n9 10 11 12\n"
    expected_output: "0 0 0 0\n0 0 0 0\n9 0 0 12\n"
  - name: no-zeroes
    input: "2 3\n1 2 3\n4 5 6\n"
    expected_output: "1 2 3\n4 5 6\n"
  - name: single-zero
    input: "1 1\n0\n"
    expected_output: "0\n"
  - name: zero-last-column
    input: "3 2\n1 0\n2 3\n4 5\n"
    expected_output: "0 0\n2 0\n4 0\n"
