schema_version: 1
id: swe-tree-path-sum
difficulty: medium
title: Path Sum
statement: "Determine whether a root-to-leaf path has values summing to target. Input: target, n, then level-order tokens. Output: true or false."
tags:
  - swe-interview
  - trees
  - dfs
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "22 13\n5 4 8 11 null 13 4 7 2 null null null 1\n"
    expected_output: "true\n"
  - name: wrong-target
    input: "5 3\n1 2 3\n"
    expected_output: "false\n"
  - name: single-match
    input: "-2 1\n-2\n"
    expected_output: "true\n"
  - name: edge-no-matching-leaf
    input: "0 3\n1 2 3\n"
    expected_output: "false\n"
  - name: edge-negative-values
    input: "-1 3\n1 -2 3\n"
    expected_output: "true\n"
  - name: edge-single-mismatch
    input: "4 1\n-4\n"
    expected_output: "false\n"
