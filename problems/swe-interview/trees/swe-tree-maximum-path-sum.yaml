schema_version: 1
id: swe-tree-maximum-path-sum
difficulty: medium
title: Binary Tree Maximum Path Sum
statement: "Find the largest sum along any nonempty path in a binary tree; a path may start and end at any nodes. Input: n followed by level-order tokens. Output: the maximum sum."
tags:
  - swe-interview
  - trees
  - dfs
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "7\n-10 9 20 null null 15 7\n"
    expected_output: "42\n"
  - name: all-negative
    input: "3\n-3 -2 -5\n"
    expected_output: "-2\n"
  - name: single
    input: "1\n4\n"
    expected_output: "4\n"
  - name: edge-single-negative
    input: "1\n-9\n"
    expected_output: "-9\n"
  - name: edge-two-children
    input: "3\n1 2 3\n"
    expected_output: "6\n"
  - name: edge-zero-bridge
    input: "3\n-1 0 -2\n"
    expected_output: "0\n"
