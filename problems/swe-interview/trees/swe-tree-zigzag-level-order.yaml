schema_version: 1
id: swe-tree-zigzag-level-order
difficulty: medium
title: Zigzag Level Order Traversal
statement: "Print tree levels alternating left-to-right and right-to-left. Input: n followed by level-order tokens. Output: level count, then each level in its required direction."
tags:
  - swe-interview
  - trees
  - bfs
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "7\n3 9 20 null null 15 7\n"
    expected_output: "3\n3\n20 9\n15 7\n"
  - name: two-levels
    input: "3\n1 2 3\n"
    expected_output: "2\n1\n3 2\n"
  - name: single
    input: "1\n8\n"
    expected_output: "1\n8\n"
  - name: edge-three-levels
    input: "7\n1 2 3 4 5 6 7\n"
    expected_output: "3\n1\n3 2\n4 5 6 7\n"
  - name: edge-left-skewed
    input: "5\n1 2 null 3 null\n"
    expected_output: "3\n1\n2\n3\n"
  - name: edge-single-node
    input: "1\n-1\n"
    expected_output: "1\n-1\n"
