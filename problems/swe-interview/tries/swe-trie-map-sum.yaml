schema_version: 1
id: swe-trie-map-sum
difficulty: medium
title: Map Sum Pairs
statement: "Maintain key-value pairs where inserting a key replaces its previous value. For each sum prefix query, output the sum of values for keys with that prefix. Input: q commands insert key value or sum prefix. Output: one result per sum."
tags:
  - swe-interview
  - tries
  - design
  - prefix-tree
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "5\ninsert apple 3\nsum ap\ninsert app 2\nsum ap\nsum apple\n"
    expected_output: "3\n5\n3\n"
  - name: overwrite
    input: "4\ninsert aa 2\ninsert aa 5\nsum a\nsum aa\n"
    expected_output: "5\n5\n"
  - name: no-match
    input: "2\ninsert cat 7\nsum z\n"
    expected_output: "0\n"
  - name: edge-overwrite-existing-key
    input: "5\ninsert app 3\nsum ap\ninsert app 8\nsum ap\nsum app\n"
    expected_output: "3\n8\n8\n"
  - name: edge-prefixes-overlap
    input: "4\ninsert a 1\ninsert ab 2\nsum a\nsum ab\n"
    expected_output: "3\n2\n"
  - name: edge-negative-values
    input: "3\ninsert cat -4\nsum c\nsum z\n"
    expected_output: "-4\n0\n"
