schema_version: 1
id: swe-trie-prefix-scores
difficulty: medium
title: Sum of Prefix Scores
statement: "For each word, sum the number of input words sharing each of its nonempty prefixes. Input: n followed by n lowercase words. Output: one score per word."
tags:
  - swe-interview
  - tries
  - prefix-tree
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "4\nabc ab bc b\n"
    expected_output: "5 4 3 2\n"
  - name: shared
    input: "3\na aa aaa\n"
    expected_output: "6 5 3\n"
  - name: single
    input: "1\ncode\n"
    expected_output: "4\n"
  - name: edge-one-word
    input: "1\na\n"
    expected_output: "1\n"
  - name: edge-no-common-prefix
    input: "3\na b c\n"
    expected_output: "1 1 1\n"
  - name: edge-duplicate-words
    input: "3\nabc abc ab\n"
    expected_output: "8 8 6\n"
