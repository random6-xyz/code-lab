schema_version: 1
id: swe-dp-unique-paths-obstacles
difficulty: medium
title: Unique Paths With Obstacles
statement: "Count paths from the top-left to bottom-right of a grid, moving only right or down; 1 marks a blocked cell. Input: rows, columns, then the grid. Output: path count."
tags:
  - swe-interview
  - dynamic-programming
  - 2d-dp
  - grid
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "3 3\n0 0 0\n0 1 0\n0 0 0\n"
    expected_output: "2\n"
  - name: blocked-start
    input: "2 2\n1 0\n0 0\n"
    expected_output: "0\n"
  - name: no-obstacles
    input: "2 3\n0 0 0\n0 0 0\n"
    expected_output: "3\n"
  - name: edge-blocked-finish
    input: "2 2\n0 0\n0 1\n"
    expected_output: "0\n"
  - name: edge-single-open-cell
    input: "1 1\n0\n"
    expected_output: "1\n"
  - name: edge-single-blocked-cell
    input: "1 1\n1\n"
    expected_output: "0\n"
