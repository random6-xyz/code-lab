schema_version: 1
id: swe-dp-coin-change
difficulty: medium
title: Coin Change
statement: "Find the fewest coins needed to make amount using unlimited coins of the given denominations. Input: n and amount followed by n positive coin values. Output: the minimum count, or -1 if impossible."
tags:
  - swe-interview
  - dynamic-programming
  - 1d-dp
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "3 11\n1 2 5\n"
    expected_output: "3\n"
  - name: impossible
    input: "1 3\n2\n"
    expected_output: "-1\n"
  - name: zero-amount
    input: "2 0\n1 3\n"
    expected_output: "0\n"
  - name: edge-exact-denomination
    input: "3 10\n1 3 4\n"
    expected_output: "3\n"
  - name: edge-impossible-odd
    input: "2 7\n2 4\n"
    expected_output: "-1\n"
  - name: edge-large-amount
    input: "3 27\n2 5 10\n"
    expected_output: "4\n"
