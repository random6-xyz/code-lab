schema_version: 1
id: swe-dp-best-time-stock-cooldown
difficulty: medium
title: Best Time to Buy and Sell Stock With Cooldown
statement: "Choose any number of buy/sell transactions, but after selling, wait one day before buying again. Hold at most one share. Input: n followed by daily prices. Output: maximum profit."
tags:
  - swe-interview
  - dynamic-programming
  - 1d-dp
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "5\n1 2 3 0 2\n"
    expected_output: "3\n"
  - name: declining
    input: "4\n5 4 3 2\n"
    expected_output: "0\n"
  - name: two-peaks
    input: "6\n1 2 4 0 2 5\n"
    expected_output: "6\n"
  - name: edge-single-day
    input: "1\n8\n"
    expected_output: "0\n"
  - name: edge-one-profitable-trade
    input: "4\n1 2 3 4\n"
    expected_output: "3\n"
  - name: edge-flat-prices
    input: "4\n5 5 5 5\n"
    expected_output: "0\n"
