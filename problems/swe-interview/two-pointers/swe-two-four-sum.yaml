schema_version: 1
id: swe-two-four-sum
difficulty: medium
title: Four Sum
statement: "Return all unique quadruplets that sum to target. Sort each quadruplet and order results lexicographically. Input: n and target followed by n integers. Output: count, then one quadruplet per line."
tags:
  - swe-interview
  - two-pointers
  - sorting
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "6 0\n1 0 -1 0 -2 2\n"
    expected_output: "3\n-2 -1 1 2\n-2 0 0 2\n-1 0 0 1\n"
  - name: duplicates
    input: "5 0\n2 2 2 2 2\n"
    expected_output: "0\n"
  - name: multiple
    input: "6 0\n0 0 0 0 0 0\n"
    expected_output: "1\n0 0 0 0\n"
  - name: exactly-four-values
    input: "4 10\n1 2 3 4\n"
    expected_output: "1\n1 2 3 4\n"
  - name: negative-target
    input: "6 0\n-3 -2 -1 0 1 2\n"
    expected_output: "2\n-3 0 1 2\n-2 -1 1 2\n"
  - name: no-solution
    input: "4 100\n1 2 3 4\n"
    expected_output: "0\n"
