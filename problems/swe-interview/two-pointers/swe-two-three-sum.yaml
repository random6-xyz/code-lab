schema_version: 1
id: swe-two-three-sum
difficulty: medium
title: Three Sum
statement: "Return all unique triplets whose values sum to zero. Sort each triplet and order triplets lexicographically. Input: n followed by n integers. Output: count, then one triplet per line."
tags:
  - swe-interview
  - two-pointers
  - sorting
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "6\n-1 0 1 2 -1 -4\n"
    expected_output: "2\n-1 -1 2\n-1 0 1\n"
  - name: all-zeroes
    input: "4\n0 0 0 0\n"
    expected_output: "1\n0 0 0\n"
  - name: none
    input: "3\n1 2 -4\n"
    expected_output: "0\n"
  - name: exactly-one-triplet
    input: "3\n-2 0 2\n"
    expected_output: "1\n-2 0 2\n"
  - name: many-duplicates
    input: "6\n-1 -1 -1 0 1 2\n"
    expected_output: "2\n-1 -1 2\n-1 0 1\n"
  - name: positive-only
    input: "4\n1 2 3 4\n"
    expected_output: "0\n"
