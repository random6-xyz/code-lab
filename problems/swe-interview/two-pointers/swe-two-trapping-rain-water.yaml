schema_version: 1
id: swe-two-trapping-rain-water
difficulty: medium
title: Trapping Rain Water
statement: "Given bar heights, compute how many units of water remain after raining. Input: n followed by n nonnegative heights. Output: the total trapped water."
tags:
  - swe-interview
  - two-pointers
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "12\n0 1 0 2 1 0 1 3 2 1 2 1\n"
    expected_output: "6\n"
  - name: deep-basin
    input: "6\n4 2 0 3 2 5\n"
    expected_output: "9\n"
  - name: increasing
    input: "3\n1 2 3\n"
    expected_output: "0\n"
  - name: flat-roof
    input: "4\n3 3 3 3\n"
    expected_output: "0\n"
  - name: small-basin
    input: "3\n3 0 3\n"
    expected_output: "3\n"
  - name: two-bars
    input: "2\n5 1\n"
    expected_output: "0\n"
