schema_version: 1
id: swe-list-rotate-right
difficulty: medium
title: Rotate List Right
statement: "Rotate a list to the right by k positions. Input: n and k followed by n values. Output: the rotated list."
tags:
  - swe-interview
  - linked-lists
  - pointers
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "5 2\n1 2 3 4 5\n"
    expected_output: "4 5 1 2 3\n"
  - name: multiple-lengths
    input: "3 4\n0 1 2\n"
    expected_output: "2 0 1\n"
  - name: no-rotation
    input: "3 0\n1 2 3\n"
    expected_output: "1 2 3\n"
  - name: edge-rotation-multiple-of-length
    input: "3 6\n1 2 3\n"
    expected_output: "1 2 3\n"
  - name: edge-empty
    input: "0 5\n\n"
    expected_output: "\n"
  - name: edge-one-node
    input: "1 99\n4\n"
    expected_output: "4\n"
