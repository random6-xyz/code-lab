schema_version: 1
id: swe-list-add-two-numbers
difficulty: medium
title: Add Two Numbers
statement: "Each number is stored as a reversed list of decimal digits. Add the numbers and return the result in the same reversed representation. Input: n, first digit list, m, second digit list. Output: result digits."
tags:
  - swe-interview
  - linked-lists
  - carry
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "3\n2 4 3\n3\n5 6 4\n"
    expected_output: "7 0 8\n"
  - name: zeroes
    input: "1\n0\n1\n0\n"
    expected_output: "0\n"
  - name: carry-chain
    input: "3\n9 9 9\n1\n1\n"
    expected_output: "0 0 0 1\n"
  - name: edge-carry-all-digits
    input: "2\n9 9\n1\n1\n"
    expected_output: "0 0 1\n"
  - name: edge-different-lengths
    input: "1\n5\n3\n5 9 9\n"
    expected_output: "0 0 0 1\n"
  - name: edge-zero-plus-number
    input: "1\n0\n2\n3 4\n"
    expected_output: "3 4\n"
