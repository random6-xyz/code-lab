schema_version: 1
id: swe-list-remove-nth-from-end
difficulty: medium
title: Remove Nth Node From End
statement: "Remove the nth node from the end of a singly linked list. Input: n, n list values, then the removal position from the end. Output: the remaining values."
tags:
  - swe-interview
  - linked-lists
  - two-pointers
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "5\n1 2 3 4 5\n2\n"
    expected_output: "1 2 3 5\n"
  - name: remove-head
    input: "3\n1 2 3\n3\n"
    expected_output: "2 3\n"
  - name: remove-tail
    input: "3\n1 2 3\n1\n"
    expected_output: "1 2\n"
  - name: edge-remove-only-node
    input: "1\n8\n1\n"
    expected_output: "\n"
  - name: edge-remove-head-two
    input: "2\n5 6\n2\n"
    expected_output: "6\n"
  - name: edge-remove-middle
    input: "5\n1 2 3 4 5\n3\n"
    expected_output: "1 2 4 5\n"
