schema_version: 1
id: swe-list-sort
difficulty: medium
title: Sort a Linked List
statement: "Sort a singly linked list in ascending order in O(n log n) time. Input: n followed by n integers. Output: the sorted values."
tags:
  - swe-interview
  - linked-lists
  - merge-sort
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: sample
    input: "4\n4 2 1 3\n"
    expected_output: "1 2 3 4\n"
  - name: duplicates
    input: "5\n-1 5 3 3 0\n"
    expected_output: "-1 0 3 3 5\n"
  - name: empty
    input: "0\n\n"
    expected_output: "\n"
  - name: edge-negative-duplicates
    input: "6\n3 -1 2 -1 0 3\n"
    expected_output: "-1 -1 0 2 3 3\n"
  - name: edge-two-reversed
    input: "2\n9 -4\n"
    expected_output: "-4 9\n"
  - name: edge-single
    input: "1\n0\n"
    expected_output: "0\n"
