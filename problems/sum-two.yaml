schema_version: 1
id: sum-two
difficulty: easy
title: Sum Two
statement: |
  Read two integers from standard input and print their sum.
tags:
  - math
  - beginner
time_limit_ms: 1000
memory_limit_mb: 128
test_cases:
  - name: positive-numbers
    input: |
      2 3
    expected_output: |
      5
  - name: negative-number
    input: |
      -4 9
    expected_output: |
      5
  - name: zero-operands
    input: "0 0\n"
    expected_output: "0\n"
  - name: both-negative
    input: "-8 -5\n"
    expected_output: "-13\n"
  - name: opposite-sign-cancellation
    input: "123 -123\n"
    expected_output: "0\n"
  - name: large-positive-result
    input: "999999999 1\n"
    expected_output: "1000000000\n"
